name: tests


on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]


jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup python3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run ruff check
        env:
          FORCE_COLOR: 1
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup python3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run ty check
        env:
          FORCE_COLOR: 1
  docs:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: docker://mosquito/aiormq-rabbitmq
        ports:
          - 5671:5671
          - 5672:5672
          - 15671:15671
          - 15672:15672
    steps:
      - uses: actions/checkout@v7
      - name: Setup python3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run pytest -svv README.md
        env:
          AMQP_URL: amqp://guest:guest@localhost//
          FORCE_COLOR: 1

  tests:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: docker://mosquito/aiormq-rabbitmq
        ports:
          - 5671:5671
          - 5672:5672
          - 15671:15671
          - 15672:15672

    strategy:
      fail-fast: false

      # The uvloop wheels start at cp314t, therefore the 3.13 free-threaded
      # build runs on the asyncio event loop.
      matrix:
        include:
          - python: '3.11'
            loop: uvloop
          - python: '3.12'
            loop: uvloop
          - python: '3.13'
            loop: uvloop
          - python: '3.13t'
            loop: asyncio
          - python: '3.14'
            loop: uvloop
          - python: '3.14t'
            loop: uvloop
          - python: '3.15'
            loop: uvloop
          - python: '3.15t'
            loop: uvloop
    steps:
      - uses: actions/checkout@v7
      - name: Setup python${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python }}"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v10.2.0
      - run: >-
          uv sync --no-default-groups
          --group dev
          --group ${{ matrix.loop }}
      - name: pytest
        run: >-
          uv run pytest \
            -vv \
            --cov=aiormq \
            --cov-report=term-missing \
            --doctest-modules \
            --aiomisc-test-timeout=120 \
            tests
        env:
          AMQP_URL: amqp://guest:guest@localhost//
          FORCE_COLOR: 1
      - run: uv run coveralls
        env:
          COVERALLS_PARALLEL: 'true'
          COVERALLS_SERVICE_NAME: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish:
    needs:
       - tests
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
