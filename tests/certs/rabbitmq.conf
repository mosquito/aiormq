# Configuration for the aiormq test broker image.
#
# The official image since 3.9 ignores the RABBITMQ_SSL_* environment
# variables, therefore the TLS listener needs this file.

listeners.tcp.default = 5672
listeners.ssl.default = 5671

ssl_options.cacertfile = /certs/ca.pem
ssl_options.certfile = /certs/server.pem
ssl_options.keyfile = /certs/server.key

# The test suite connects with and without a client certificate.
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false

management.ssl.port = 15671
management.ssl.cacertfile = /certs/ca.pem
management.ssl.certfile = /certs/server.pem
management.ssl.keyfile = /certs/server.key

# The test suite and the README examples declare transient non-exclusive
# queues. RabbitMQ 4 forbids them by default.
deprecated_features.permit.transient_nonexcl_queues = true

# The test suite publishes messages larger than the RabbitMQ 4 default
# limit of 16 MiB.
max_message_size = 134217728
